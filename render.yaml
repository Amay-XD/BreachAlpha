# render.yaml
services:
  - type: web
    name: breach-alpha-backend
    env: python
    plan: free  # or pro
    startCommand: gunicorn -w 4 -b 0.0.0.0:$PORT run:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_HOST
        value: 0.0.0.0
      - key: FLASK_PORT
        value: $PORT
      - key: CORS_ORIGINS
        value: https://your-frontend.vercel.app
    buildCommand: pip install -r requirements.txt
